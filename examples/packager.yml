app_name: Mywbstd
app_version: 1.0.0
app_dir: app/wb-std
document_root: public
entrypoint: index.php
healthcheck_path: public/healthz.php
php_runtime: runtime/php80
output_dir: dist
work_dir: work
open_mode: browser
php_extensions_required:
  - bcmath
  - curl
  - mbstring
  - mysqli
  - openssl
  - pdo_mysql
php_ini:
  memory_limit: 256M
  max_execution_time: 60
  post_max_size: 32M
  upload_max_filesize: 32M
exclude:
  - .git
  - node_modules
  - tests
  - docs
